<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lomos · mi librería</title>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lomos">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#A85A6E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Manrope:wght@500;600;700;800&family=Yellowtail&display=swap" rel="stylesheet">
<style>
:root{--cream:#F3E6DA;--orange:#D9B86A;--green:#A85A6E;--pink:#E7B7A3;--lime:#D9B86A;--ink:#4A2A2F;--red:#A85A6E;--lilac:#A9AE88;--sky:#A9AE88;--yellow:#C46A48;--wine:#4A2A2F}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--cream);color:var(--ink);font-family:Manrope,system-ui,sans-serif}
button{font-family:inherit;color:inherit;cursor:pointer}
#app{max-width:520px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 18px 130px}
h1,h2,h3{font-family:'Bricolage Grotesque',Manrope,sans-serif;margin:0;letter-spacing:-.025em;line-height:.95}
h1{font-size:46px;font-weight:800}
h2{font-size:28px;font-weight:800}
h3{font-size:20px;font-weight:700;line-height:1.05}
.script{font-family:Yellowtail,cursive;color:var(--red);font-size:26px;line-height:1;display:inline-block;transform:rotate(-3deg)}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding-top:6px}
.round{width:44px;height:44px;border-radius:50%;border:2px solid var(--ink);background:transparent;font-size:18px;flex:none}
.logo{width:46px;height:46px;border-radius:14px;flex:none}
.small{font-size:13px;opacity:.75;font-weight:600}
.card{border-radius:30px;padding:20px;margin-top:14px}
.c-green{background:var(--green);color:var(--cream)}
.c-lilac{background:var(--lilac)}
.c-pink{background:var(--pink)}
.c-lime{background:var(--lime)}
.c-orange{background:var(--orange)}
.c-sky{background:var(--sky)}
.c-red{background:var(--red);color:var(--cream)}
.c-white{background:#FBF3EA;border:2px solid var(--ink)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border:0;text-align:left;border-radius:28px;padding:18px;min-height:130px;display:flex;flex-direction:column;justify-content:space-between;margin-top:14px}
.tile h3{font-size:24px}
.btn{border:0;border-radius:999px;padding:13px 20px;font-weight:800;font-size:15px;background:var(--ink);color:var(--cream)}
.btn.light{background:var(--cream);color:var(--ink)}
.btn.lime{background:var(--lime);color:var(--ink)}
.btn.pink{background:var(--pink);color:var(--ink)}
.btn.ghost{background:transparent;border:2px solid currentColor;color:inherit}
.btn.block{width:100%}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;margin:14px -18px 0;padding:2px 18px 6px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{border:2px solid var(--ink);background:transparent;border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px;white-space:nowrap;flex:none}
.chip.on{background:var(--ink);color:var(--cream)}
.bar{height:12px;border-radius:99px;background:rgba(0,0,0,.16);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--lime);border-radius:99px;transition:width .5s}
.big{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:56px;letter-spacing:-.04em;line-height:.9}
.kpi{border-radius:26px;padding:16px;min-height:112px;display:flex;flex-direction:column;justify-content:space-between}
.kpi .big{font-size:40px}
.kpi span{font-weight:700;font-size:13px;line-height:1.15}
.week{display:flex;justify-content:space-between;margin-top:12px}
.day{display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:800;font-size:12px}
.day b{width:34px;height:34px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-size:13px}
.day.on b{background:var(--ink);color:var(--cream)}
.day.today b{box-shadow:0 0 0 3px var(--cream),0 0 0 5px var(--ink)}
/* librería */
.shelfwrap{background:var(--wine);border-radius:32px;padding:22px 14px 14px;margin-top:16px;min-height:240px}
.shelfrow{display:flex;align-items:flex-end;gap:5px;padding:0 6px;min-height:150px}
.plank{height:12px;border-radius:6px;background:#7a4a50;margin:0 0 26px;box-shadow:0 6px 0 rgba(0,0,0,.14)}
.spine{border:0;border-radius:5px 5px 2px 2px;position:relative;display:flex;align-items:center;justify-content:center;padding:26px 0;flex:none;transition:transform .2s}
.spine:active{transform:translateY(-6px)}
.spine::before,.spine::after{content:"";position:absolute;left:0;right:0;height:5px;background:rgba(0,0,0,.18)}
.spine::before{top:10px}.spine::after{bottom:10px}
.spine span{writing-mode:vertical-rl;transform:rotate(180deg);font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:13px;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-height:100%}
.spine.leyendo{transform:translateY(-12px)}
.spine .mk{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:10px;height:10px;border-radius:50%;background:var(--lime);border:2px solid var(--wine)}
.spine .ok{position:absolute;bottom:14px;font-size:11px;left:50%;transform:translateX(-50%);writing-mode:horizontal-tb}
.empty{color:var(--cream);text-align:center;padding:40px 10px;font-weight:600}
.empty b{font-family:'Bricolage Grotesque';font-size:26px;display:block;margin-bottom:6px}
/* wheel */
.wheelbox{position:relative;margin:14px auto 0;max-width:340px}
.wheelbox svg{width:100%;display:block}
.seg{display:flex;background:rgba(74,42,47,.08);border-radius:999px;padding:4px;margin-top:16px}
.seg button{flex:1;border:0;background:transparent;padding:10px;border-radius:999px;font-weight:800;font-size:14px}
.seg button.on{background:var(--ink);color:var(--cream)}
/* mood */
.wiz{background:var(--red);color:var(--cream);border-radius:32px;padding:20px 16px 18px;margin-top:16px;min-height:480px;display:flex;flex-direction:column}
.wiz h2{font-size:38px;text-align:center;font-weight:600;margin:26px 0 22px;line-height:1}
.wiz .prog{display:flex;gap:6px;flex:1}
.wiz .prog i{flex:1;height:4px;border-radius:4px;background:rgba(255,255,255,.28)}
.wiz .prog i.on{background:var(--cream)}
.wiz .wtop{display:flex;align-items:center;gap:14px}
.wiz .wtop button{background:none;border:0;color:var(--cream);font-weight:700;font-size:15px;padding:4px}
.wiz .chips{justify-content:center;gap:10px}
.wiz .chip{background:#8B3F55;border-color:transparent;color:var(--cream);font-size:16px;padding:12px 20px;font-weight:600}
.wiz .chip.on{background:var(--sky);color:var(--ink);transform:rotate(-2deg)}
.wiz .go{margin-top:auto;padding-top:22px}
.wiz .go .btn{background:#fff;color:var(--ink);width:100%;padding:17px;font-size:17px}
.res{display:flex;gap:14px;align-items:center}
.pct{font-family:'Bricolage Grotesque';font-weight:800;font-size:34px;letter-spacing:-.03em}
/* nav */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));width:min(92%,420px);background:var(--ink);border-radius:999px;padding:7px;display:flex;gap:4px;z-index:20;box-shadow:0 10px 30px rgba(74,42,47,.35)}
.nav button{flex:1;border:0;background:transparent;color:var(--cream);opacity:.75;border-radius:999px;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700}
.nav button.on{background:var(--cream);color:var(--ink);opacity:1}
.nav svg{width:22px;height:22px}
/* sheet */
.back{position:fixed;inset:0;background:rgba(74,42,47,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50;animation:fade .2s}
.sheet{background:var(--cream);width:min(100%,560px);max-height:92vh;overflow:auto;border-radius:32px 32px 0 0;padding:22px 20px calc(30px + env(safe-area-inset-bottom));animation:up .25s}
@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(40px)}}
.sheet h2{margin-bottom:14px}
label{display:block;font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.06em;margin:16px 0 6px}
input,textarea{width:100%;border:2px solid var(--ink);border-radius:16px;padding:12px 14px;background:#FBF3EA;font:600 16px Manrope,sans-serif;color:var(--ink)}
textarea{min-height:110px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stars button{background:none;border:0;font-size:32px;color:#dccdb8;padding:0 2px;line-height:1}
.stars button.on{color:var(--yellow)}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw button{width:34px;height:34px;border-radius:50%;border:2px solid rgba(74,42,47,.25)}
.sw button.on{box-shadow:0 0 0 3px var(--cream),0 0 0 5px var(--ink)}
.chk{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(74,42,47,.12);font-weight:700;width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.chk i{width:22px;height:22px;border-radius:7px;border:2px solid var(--ink);display:grid;place-items:center;font-style:normal;font-size:14px;flex:none}
.chk.on i{background:var(--ink);color:var(--cream)}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:var(--cream);padding:12px 20px;border-radius:999px;font-weight:700;font-size:14px;z-index:80;max-width:90%;text-align:center}
.bars{display:flex;align-items:flex-end;gap:5px;height:110px;margin-top:14px}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:4px;font-size:11px;font-weight:800}
.bars i{display:block;width:100%;background:var(--ink);border-radius:6px 6px 3px 3px;min-height:3px}
.list{margin:10px 0 0;padding:0;list-style:none}
.list li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid rgba(74,42,47,.15);font-weight:700;font-size:14px}
.list li span:last-child{opacity:.7;text-align:right}
a{color:inherit}
</style>
</head>
<body>
<div id="app"></div>
<div id="layer"></div>
<script>
(function(){
'use strict';
var KEY='lomos.v1';
var PAL=['#E7B7A3','#D9B86A','#A9AE88','#A85A6E','#C46A48','#F3E6DA','#7E8760','#8B3F55','#B98A6A','#6F4A52'];
var WCOL=['#E7B7A3','#D9B86A','#A9AE88','#C46A48','#A85A6E','#F3E6DA'];
var MONTHS=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
var DOW=['D','L','M','M','J','V','S'];
var GENRES=['Romance','Ficción','Fantasía','Misterio','Ciencia ficción','Histórica','No ficción','Poesía','Clásico','Terror','Juvenil','Ensayo'];
var MOODS=['Alegría','Melancolía','Cansancio','Curiosidad','Aventura','Romance','Nostalgia','Estrés','Reflexión','Ganas de llorar'];
var STEPS=[
 {k:'tone',q:'¿Lectura light o deep?',o:[['light','Light'],['deep','Deep']]},
 {k:'plot',q:'¿Con trama o puro vibe?',o:[['trama','Con trama'],['vibe','No-plot, just vibes']]},
 {k:'len',q:'¿Largo o corto?',o:[['corto','Corto'],['medio','Mediano'],['largo','Largo']]},
 {k:'genres',q:'¿Qué género se te antoja?',multi:1,o:GENRES.map(function(g){return [g,g]})},
 {k:'moods',q:'¿Qué mood traes hoy?',multi:1,o:MOODS.map(function(g){return [g,g]})}
];
var DEF={name:'',goal:12,books:[],lists:[],updated:0};

/* ---------- utils ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pad(n){return String(n).padStart(2,'0')}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function todayStr(){return ymd(new Date())}
function pd(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])}
function addDays(s,n){var d=pd(s);d.setDate(d.getDate()+n);return ymd(d)}
function dayDiff(a,b){return Math.round((pd(b)-pd(a))/864e5)}
function fmtDate(s){if(!s)return '';var d=pd(s);return d.getDate()+' '+MONTHS[d.getMonth()]+' '+d.getFullYear()}
function fmtShort(s){var d=pd(s);return d.getDate()+' '+MONTHS[d.getMonth()]}
function uid(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3)}
function rgb(h){var n=parseInt(h.slice(1),16);return [n>>16&255,n>>8&255,n&255]}
function lum(h){var c=rgb(h);return (0.299*c[0]+0.587*c[1]+0.114*c[2])/255}
function onCol(h){return lum(h)>0.6?'#4A2A2F':'#F3E6DA'}
function hsl(h){var c=rgb(h).map(function(v){return v/255}),mx=Math.max.apply(0,c),mn=Math.min.apply(0,c),l=(mx+mn)/2,s=0,hh=0,d=mx-mn;
 if(d){s=l>.5?d/(2-mx-mn):d/(mx+mn);if(mx===c[0])hh=((c[1]-c[2])/d+(c[1]<c[2]?6:0));else if(mx===c[1])hh=(c[2]-c[0])/d+2;else hh=(c[0]-c[1])/d+4;hh*=60}
 return [hh,s,l]}
function hashN(s){var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return Math.abs(h)}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function fnum(n){return (Math.round(n*10)/10).toString().replace('.',',')}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}

/* ---------- state ---------- */
var S=load();
function load(){try{var r=JSON.parse(localStorage.getItem(KEY));if(r&&r.books)return Object.assign({},DEF,r)}catch(e){}return JSON.parse(JSON.stringify(DEF))}
var ui={tab:'home',filter:'all',sort:'added',pick:'ruleta',cat:'pend',incRead:false,rot:0,sample:[],sKey:'',spinning:false,spun:false,mood:{step:0,ans:{},done:false},sync:'local'};
var remote=null,saveT=null,D=null,DL=null,LG=null;

function save(){S.updated=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}clearTimeout(saveT);saveT=setTimeout(pushRemote,700)}
function pushRemote(){if(!remote)return;try{Promise.resolve(remote.set({json:JSON.stringify(S),updated:S.updated})).then(function(){ui.sync='ok'}).catch(function(){ui.sync='local'})}catch(e){ui.sync='local'}}
async function initRemote(){
 try{
  if(!(window.claude&&window.claude.use))return;
  var db=await window.claude.use('db'),user=await window.claude.use('user');
  if(!db||!user)return;
  var id=await user.id();if(!id)return;
  var ref=db.collection('data/users/'+id).doc('state');
  var snap=await ref.get(),d=null;
  if(snap){d=(typeof snap.data==='function')?snap.data():(snap.exists===false?null:snap)}
  remote=ref;ui.sync='ok';
  if(d&&d.json){
   var r=JSON.parse(d.json);
   if((r.updated||0)>(S.updated||0)){S=Object.assign({},DEF,r);try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(!document.querySelector('.back'))render()}
   else if((S.updated||0)>(r.updated||0)){pushRemote()}
  }else if(S.books.length){pushRemote()}
 }catch(e){}
}

/* ---------- helpers ---------- */
function bk(id){return S.books.find(function(b){return b.id===id})}
function newBook(o){return Object.assign({id:uid(),title:'',author:'',pages:0,cur:0,format:'fisico',color:PAL[Math.floor(Math.random()*PAL.length)],status:'porleer',stars:0,startDate:'',endDate:'',tone:'',plot:'',genres:[],moods:[],log:{},added:Date.now()},o||{})}
function pctOf(b){return b.pages?clamp(Math.round(b.cur/b.pages*100),0,100):0}
function toast(t){var e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(function(){e.remove()},2300)}
function icon(n){
 var p={home:'<path d="M3 11l9-8 9 8v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/>',
 shelf:'<rect x="3" y="5" width="4" height="15" rx="1"/><rect x="9" y="3" width="4" height="17" rx="1"/><path d="M16 20L20 6l2 .6-4 14z"/>',
 pick:'<circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M12 3v9l6.4 6.4M12 12H3.5" stroke="currentColor" stroke-width="2.2" fill="none"/>',
 stats:'<rect x="3" y="12" width="4" height="8" rx="1"/><rect x="10" y="4" width="4" height="16" rx="1"/><rect x="17" y="9" width="4" height="11" rx="1"/>'};
 return '<svg viewBox="0 0 24 24" fill="currentColor">'+p[n]+'</svg>'}

/* ---------- stats ---------- */
function stats(){
 var bs=S.books,read=bs.filter(function(b){return b.status==='leido'}),yr=String(new Date().getFullYear());
 var readYr=read.filter(function(b){return (b.endDate||'').indexOf(yr)===0});
 var durs=read.filter(function(b){return b.endDate}).map(function(b){return {b:b,d:Math.max(1,dayDiff(b.startDate||b.endDate,b.endDate)+1)}});
 var avg=durs.length?durs.reduce(function(a,x){return a+x.d},0)/durs.length:null;
 var fast=null,slow=null;durs.forEach(function(x){if(!fast||x.d<fast.d)fast=x;if(!slow||x.d>slow.d)slow=x});
 var byDay={};bs.forEach(function(b){Object.keys(b.log||{}).forEach(function(d){var o=byDay[d]||(byDay[d]={p:0,t:[]});o.p+=b.log[d];if(o.t.indexOf(b.title)<0)o.t.push(b.title)})});
 var best=null;Object.keys(byDay).forEach(function(d){if(!best||byDay[d].p>best.p)best={d:d,p:byDay[d].p,t:byDay[d].t}});
 var t=todayStr(),d=byDay[t]?t:addDays(t,-1),streak=0;while(byDay[d]){streak++;d=addDays(d,-1)}
 var months=[];for(var i=0;i<12;i++)months.push(0);readYr.forEach(function(b){months[pd(b.endDate).getMonth()]++});
 var pages=read.reduce(function(a,b){return a+(b.pages||0)},0)+bs.filter(function(b){return b.status==='leyendo'}).reduce(function(a,b){return a+(b.cur||0)},0);
 var logDays=Object.keys(byDay).length,logPages=Object.keys(byDay).reduce(function(a,k){return a+byDay[k].p},0);
 var rated=read.filter(function(b){return b.stars>0}),avgR=rated.length?rated.reduce(function(a,b){return a+b.stars},0)/rated.length:null;
 var longest=null;read.forEach(function(b){if(b.pages&&(!longest||b.pages>longest.pages))longest=b});
 return {read:read,readYr:readYr,avg:avg,fast:fast,slow:slow,byDay:byDay,best:best,streak:streak,months:months,pages:pages,pace:logDays?logPages/logDays:null,avgR:avgR,longest:longest,yr:yr};
}

/* ---------- views ---------- */
function render(){
 var v={home:viewHome,shelf:viewShelf,pick:viewPick,stats:viewStats}[ui.tab]();
 var nav='<nav class="nav">'+[['home','Inicio'],['shelf','Librería'],['pick','Elegir'],['stats','Stats']].map(function(t){return '<button class="'+(ui.tab===t[0]?'on':'')+'" data-act="tab" data-v="'+t[0]+'">'+icon(t[0])+t[1]+'</button>'}).join('')+'</nav>';
 document.getElementById('app').innerHTML=v+nav;
 if(ui.tab==='shelf')layoutShelf();
}

function spineHTML(b){
 var h=hashN(b.id),p=b.pages||300;
 var w=clamp(Math.round(20+p/10),30,58)+(h%7)-3;
 var ht=clamp(Math.round(120+p/6),150,214)+(h%9)-4;
 return '<button class="spine '+b.status+'" data-act="edit" data-id="'+b.id+'" title="'+esc(b.title)+'" style="width:'+w+'px;height:'+ht+'px;background:'+b.color+';color:'+onCol(b.color)+'" data-w="'+w+'">'+
  (b.status==='leyendo'?'<i class="mk"></i>':'')+'<span style="max-height:'+(ht-44)+'px">'+esc(b.title)+'</span>'+(b.status==='leido'?'<em class="ok" style="font-style:normal">✓</em>':'')+'</button>';
}

 var n=items.length,seg=360/n,g='';
 function pt(a,r){return [CX+r*Math.sin(a*Math.PI/180),CY-r*Math.cos(a*Math.PI/180)]}
 items.forEach(function(b,i){
  var col=WCOL[i%6];if(i===n-1&&n>1&&i%6===0)col=WCOL[3];
  var a0=i*seg,a1=(i+1)*seg,d;
  if(n===1)d='M'+CX+' '+(CY-R)+' A'+R+' '+R+' 0 1 1 '+(CX-.01)+' '+(CY-R)+' Z';
  else{var p0=pt(a0,R),p1=pt(a1,R);d='M'+CX+' '+CY+' L'+p0[0].toFixed(2)+' '+p0[1].toFixed(2)+' A'+R+' '+R+' 0 '+(seg>180?1:0)+' 1 '+p1[0].toFixed(2)+' '+p1[1].toFixed(2)+' Z'}
  var t=b.title.length>17?b.title.slice(0,16)+'…':b.title;
  g+='<path d="'+d+'" fill="'+col+'" stroke="#F3E6DA" stroke-width="3"/><text transform="rotate('+(a0+seg/2).toFixed(2)+' '+CX+' '+CY+') translate('+CX+' '+CY+') rotate(-90)" x="34" y="4" fill="'+onCol(col)+'" font-family="Bricolage Grotesque,sans-serif" font-weight="700" font-size="'+(n>9?11:13)+'">'+esc(t)+'</text>';
 });
 return '<svg viewBox="0 0 300 320"><g id="wheel" style="transform-origin:'+CX+'px '+CY+'px;transform:rotate('+ui.rot+'deg)">'+g+'</g><circle cx="'+CX+'" cy="'+CY+'" r="22" fill="#F3E6DA" stroke="#4A2A2F" stroke-width="4"/><path d="M'+CX+' 34 L134 2 L166 2 Z" fill="#4A2A2F" stroke="#4A2A2F" stroke-width="4" stroke-linejoin="round"/></svg>';
}

function spin(){

function lenCat(p){return !p?null:p<250?'corto':p<=450?'medio':'largo'}
function scoreBook(b,a){
 var s=0,m=0,why=[];
 function add(w,ok,label){m+=w;if(ok===true){s+=w;why.push(label)}else if(ok===null){s+=w*.5}}
 if(a.tone)add(2,b.tone?b.tone===a.tone:null,a.tone==='light'?'Lectura light':'Lectura deep');
 if(a.plot)add(2,b.plot?b.plot===a.plot:null,a.plot==='trama'?'Con trama':'Puro vibe');
 if(a.len)add(2,lenCat(b.pages)?lenCat(b.pages)===a.len:null,{corto:'Corto',medio:'Largo mediano',largo:'Largo'}[a.len]);
 if(a.genres&&a.genres.length)add(2,b.genres.length?b.genres.some(function(g){return a.genres.indexOf(g)>=0}):null,b.genres.filter(function(g){return a.genres.indexOf(g)>=0}).join(', '));
 if(a.moods&&a.moods.length){m+=2;if(b.moods.length){var hit=b.moods.filter(function(x){return a.moods.indexOf(x)>=0});if(hit.length){s+=2*Math.min(1,hit.length/Math.min(a.moods.length,2));why.push('Mood: '+hit.join(', '))}}else s+=1}
 var base=m?s/m:.5;
 return {b:b,pct:Math.round(base*100),rank:base+(b.stars||0)*.015+Math.random()*.02,why:why};
}

 '<div class="small" style="margin:12px 0 8px">Géneros</div>'+chipRow('genres',GENRES.map(function(g){return [g,g]}),b.genres,1)+
 '<div class="small" style="margin:12px 0 8px">Va con el mood…</div>'+chipRow('moods',MOODS.map(function(g){return [g,g]}),b.moods,1)+
 '<div class="btns" style="margin-top:24px"><button class="btn" data-act="savebook">Guardar</button>'+(isNew?'':(b.status==='leyendo'?'<button class="btn lime" data-act="log" data-id="'+b.id+'">Registrar lectura</button>':''))+'<button class="btn ghost" data-act="close">Cancelar</button>'+(isNew?'':'<button class="btn ghost" style="margin-left:auto;color:var(--red)" data-act="delbook">'+(D._del?'¿Seguro? Toca de nuevo':'Eliminar')+'</button>')+'</div>';
 sheet(h);
}
function openBook(id){var b=id?bk(id):null;D=JSON.parse(JSON.stringify(b||newBook()));D._del=false;bookSheet()}
function openLog(id){
 var b=bk(id);if(!b)return;LG={id:id};
 sheet('<h2>Registrar lectura</h2><div style="font-weight:700">'+esc(b.title)+'</div><label>Fecha</label><input id="l-date" type="date" value="'+todayStr()+'" max="'+todayStr()+'"><label>Páginas que leí</label><input id="l-n" type="number" inputmode="numeric" placeholder="0"><div class="chips" style="margin-top:10px">'+[10,20,30,50].map(function(n){return '<button class="chip" data-act="logq" data-v="'+n+'">+'+n+'</button>'}).join('')+'</div>'+(b.pages?'<p class="small" style="margin-top:12px">Vas en la pág. '+b.cur+' de '+b.pages+'.</p>':'')+'<div class="btns" style="margin-top:20px"><button class="btn" data-act="savelog">Guardar</button><button class="btn ghost" data-act="close">Cancelar</button></div>');
}
function finishBook(id){
 var b=bk(id);if(!b)return;
 b.status='leido';b.endDate=b.endDate||todayStr();if(!b.startDate)b.startDate=b.endDate;if(b.pages)b.cur=b.pages;save();
 sheet('<span class="script">¡terminado!</span><h2 style="margin:6px 0 4px">'+esc(b.title)+'</h2><div class="small">¿Qué calificación le das?</div><div class="stars" style="margin-top:10px">'+[1,2,3,4,5].map(function(n){return '<button data-act="rate" data-id="'+id+'" data-v="'+n+'">★</button>'}).join('')+'</div><div class="btns"><button class="btn ghost" data-act="close">Ahora no</button></div>');
 render();
}
function openList(id){
 var l=id?S.lists.find(function(x){return x.id===id}):null;
 DL=l?JSON.parse(JSON.stringify(l)):{id:uid(),name:'',ids:[],_new:true};listSheet();
}
function listSheet(){
 var h='<h2>'+(DL._new?'Nueva lista':'Editar lista')+'</h2><label>Nombre</label><input id="ls-name" value="'+esc(DL.name)+'" placeholder="Ej. Para el verano, Regalos, Cortitos…"><label>Libros en esta ruleta</label>';
 h+=S.books.length?S.books.map(function(b){var on=DL.ids.indexOf(b.id)>=0;return '<button class="chk'+(on?' on':'')+'" data-act="tl" data-id="'+b.id+'"><i>'+(on?'✓':'')+'</i>'+esc(b.title)+'</button>'}).join(''):'<p class="small">Aún no tienes libros.</p>';
 h+='<div class="btns" style="margin-top:20px"><button class="btn" data-act="savelist">Guardar</button><button class="btn ghost" data-act="close">Cancelar</button>'+(DL._new?'':'<button class="btn ghost" style="margin-left:auto;color:var(--red)" data-act="dellist">Eliminar lista</button>')+'</div>';
 sheet(h);
}
function openSettings(){
 sheet('<h2>Ajustes</h2><label>Tu nombre</label><input id="s-name" value="'+esc(S.name)+'" placeholder="Opcional"><label>Meta de libros este año</label><input id="s-goal" type="number" inputmode="numeric" value="'+(S.goal||'')+'">'+
 '<div class="btns"><button class="btn" data-act="savesettings">Guardar</button></div>'+
 '<label style="margin-top:26px">Añadir varios libros</label><button class="btn ghost block" data-act="addmany">Pegar una lista de títulos</button>'+
 '<label style="margin-top:22px">Respaldo</label><div class="small" style="margin-bottom:8px">'+(ui.sync==='ok'?'Tus datos se guardan en tu cuenta y en este navegador.':'Tus datos se guardan solo en este navegador. Copia un respaldo de vez en cuando.')+'</div><div class="btns" style="margin-top:0"><button class="btn light" style="border:2px solid var(--ink)" data-act="copyexp">Copiar respaldo</button><button class="btn light" style="border:2px solid var(--ink)" data-act="showimp">Importar</button></div><div id="imp"></div>'+
 (S.books.length?'':'<div class="btns"><button class="btn ghost" data-act="samples">Cargar libros de ejemplo</button></div>'));
}

/* ---------- actions ---------- */
function samples(){
 var X=[['Cien años de soledad','Gabriel García Márquez',471,'#D9B86A','fisico','deep','vibe',['Ficción','Clásico'],['Nostalgia','Reflexión']],
 ['Normal People','Sally Rooney',266,'#A9AE88','kindle','light','trama',['Romance'],['Melancolía','Ganas de llorar']],
 ['Dune','Frank Herbert',612,'#7E8760','fisico','deep','trama',['Ciencia ficción','Aventura'],['Aventura','Curiosidad']],
 ['Macbeth','William Shakespeare',160,'#E7B7A3','fisico','deep','trama',['Clásico'],['Reflexión']],
 ['Los siete maridos de Evelyn Hugo','Taylor Jenkins Reid',400,'#E7B7A3','kindle','light','trama',['Romance','Ficción'],['Nostalgia','Ganas de llorar']],
 ['Mujercitas','Louisa May Alcott',500,'#A85A6E','fisico','light','trama',['Clásico','Juvenil'],['Nostalgia','Alegría']],
 ['El nombre del viento','Patrick Rothfuss',662,'#C46A48','kindle','light','trama',['Fantasía'],['Aventura','Curiosidad']],
 ['Poeta en Nueva York','Federico García Lorca',120,'#D9B86A','fisico','deep','vibe',['Poesía'],['Melancolía','Reflexión']],
 ['Sapiens','Yuval Noah Harari',496,'#B98A6A','kindle','deep','trama',['No ficción'],['Curiosidad']],
 ['Cometas en el cielo','Khaled Hosseini',372,'#8B3F55','fisico','deep','trama',['Ficción'],['Ganas de llorar','Reflexión']]];
 X.forEach(function(x,i){var st=i===2?'leyendo':'porleer';S.books.push(newBook({title:x[0],author:x[1],pages:x[2],color:x[3],format:x[4],tone:x[5],plot:x[6],genres:x[7],moods:x[8],status:st,cur:st==='leyendo'?180:0,startDate:st==='leyendo'?addDays(todayStr(),-6):'',stars:[0,5,3,2,4,3,5,2,3,4][i],added:Date.now()+i}))});
 S.books.push(newBook({title:'Orgullo y prejuicio',author:'Jane Austen',pages:432,color:'#E7B7A3',status:'leido',cur:432,startDate:addDays(todayStr(),-30),endDate:addDays(todayStr(),-21),stars:5,log:(function(){var o={};o[addDays(todayStr(),-25)]=70;o[addDays(todayStr(),-24)]=45;return o})()}));
 save();closeSheet();render();toast('Listo, cargué ejemplos');
}
function pickAgain(){closeSheet();var pool=poolFor(ui.cat);if(pool.length>12){ui.sKey='';}render();setTimeout(spin,80)}

document.addEventListener('click',function(e){
 var t=e.target.closest('[data-act]');if(!t)return;
 if(t.dataset.bg&&e.target!==t)return;
 var a=t.dataset.act,v=t.dataset.v,id=t.dataset.id,k=t.dataset.k;
 switch(a){
  case 'close':closeSheet();D=null;break;
  case 'tab':ui.tab=v;closeSheet();render();window.scrollTo(0,0);break;
  case 'gopick':ui.tab='pick';ui.pick=v;if(v==='mood'&&ui.mood.done&&0)ui.mood={step:0,ans:{},done:false};render();window.scrollTo(0,0);break;
  case 'filter':ui.filter=v;render();break;
  case 'sort':ui.sort=v;render();break;
  case 'add':D=newBook();closeSheet();bookSheet();break;
  case 'edit':openBook(id);break;
  case 'setd':syncDraft();D[k]=(D[k]===v&&(k==='tone'||k==='plot'))?'':v;bookSheet();break;
  case 'togd':syncDraft();var i=D[k].indexOf(v);if(i>=0)D[k].splice(i,1);else D[k].push(v);bookSheet();break;
  case 'stard':syncDraft();D.stars=(D.stars===+v)?0:+v;bookSheet();break;
  case 'colord':syncDraft();D.color=v;bookSheet();break;
  case 'savebook':{
   syncDraft();if(!D.title.trim()){toast('Ponle un título');break}
   D.title=D.title.trim();D.author=D.author.trim();
   if(D.status==='leyendo'){if(!D.startDate)D.startDate=todayStr();D.endDate=''}
   if(D.status==='leido'){if(!D.endDate)D.endDate=todayStr();if(!D.startDate)D.startDate=D.endDate;if(D.pages)D.cur=D.pages}
   if(D.status==='porleer'){D.startDate='';D.endDate=''}
   delete D._del;var ix=S.books.findIndex(function(b){return b.id===D.id});if(ix>=0)S.books[ix]=D;else S.books.push(D);
   D=null;save();closeSheet();render();toast('Guardado');break}
  case 'delbook':
   if(!D._del){syncDraft();D._del=true;bookSheet();break}
   S.books=S.books.filter(function(b){return b.id!==D.id});S.lists.forEach(function(l){l.ids=l.ids.filter(function(x){return x!==D.id})});D=null;save();closeSheet();render();toast('Libro eliminado');break;
  case 'addmany':
   sheet('<h2>Añadir varios</h2><div class="small">Un libro por línea. Puedes poner el autor después de un guion: <b>Título - Autor</b></div><label>Libros</label><textarea id="m-text" placeholder="Dune - Frank Herbert&#10;Macbeth - Shakespeare&#10;Rayuela - Julio Cortázar"></textarea><label>Formato</label><div class="chips"><button class="chip on" data-act="mfmt" data-v="fisico">Físico</button><button class="chip" data-act="mfmt" data-v="kindle">Kindle</button></div><div class="btns" style="margin-top:20px"><button class="btn" data-act="savemany">Añadir</button><button class="btn ghost" data-act="close">Cancelar</button></div>');window.__mf='fisico';break;
  case 'mfmt':window.__mf=v;document.querySelectorAll('[data-act=mfmt]').forEach(function(c){c.classList.toggle('on',c.dataset.v===v)});break;
  case 'savemany':{
   var lines=(document.getElementById('m-text').value||'').split('\n').map(function(s){return s.trim()}).filter(Boolean),n=0;
   lines.forEach(function(l,j){var p=l.split(/\s+[-–—]\s+/);S.books.push(newBook({title:p[0],author:(p[1]||'').trim(),format:window.__mf||'fisico',added:Date.now()+j}));n++});
   if(n){save();closeSheet();ui.tab='shelf';render();toast(n+(n===1?' libro añadido':' libros añadidos'))}else toast('Escribe al menos un título');break}
  case 'log':closeSheet();openLog(id);break;
  case 'logq':{var inp=document.getElementById('l-n');inp.value=(parseInt(inp.value)||0)+(+v);break}
  case 'savelog':{
   var b=bk(LG.id),n2=parseInt(document.getElementById('l-n').value)||0,d=document.getElementById('l-date').value||todayStr();
   if(n2<=0){toast('Escribe cuántas páginas leíste');break}
   b.log=b.log||{};b.log[d]=(b.log[d]||0)+n2;b.cur=b.pages?Math.min(b.pages,(b.cur||0)+n2):(b.cur||0)+n2;
   if(b.status==='porleer'){b.status='leyendo'}
   if(!b.startDate||d<b.startDate)b.startDate=d;
   save();closeSheet();
   if(b.pages&&b.cur>=b.pages){finishBook(b.id)}else{render();toast('+'+n2+' páginas registradas')}
   break}
  case 'finish':finishBook(id);break;
  case 'rate':{var b3=bk(id);b3.stars=+v;save();closeSheet();render();toast('¡Anotado!');break}
  case 'startbook':{var b4=bk(id);b4.status='leyendo';if(!b4.startDate)b4.startDate=todayStr();save();closeSheet();ui.tab='home';render();window.scrollTo(0,0);toast('A leer: '+b4.title);break}
  case 'cat':ui.cat=v;render();break;
  case 'incread':ui.incRead=!ui.incRead;render();break;
  case 'spin':spin();break;
  case 'spinagain':pickAgain();break;
  case 'newlist':openList(null);break;
  case 'editlist':openList(id);break;
  case 'tl':{var nm=document.getElementById('ls-name');if(nm)DL.name=nm.value;var j=DL.ids.indexOf(id);if(j>=0)DL.ids.splice(j,1);else DL.ids.push(id);listSheet();break}
  case 'savelist':{
   var nm2=document.getElementById('ls-name');DL.name=(nm2?nm2.value:DL.name).trim();
   if(!DL.name){toast('Ponle un nombre a la lista');break}
   var isNew=DL._new;delete DL._new;var li=S.lists.findIndex(function(x){return x.id===DL.id});if(li>=0)S.lists[li]=DL;else S.lists.push(DL);
   ui.cat='l:'+DL.id;DL=null;save();closeSheet();render();toast(isNew?'Lista creada':'Lista guardada');break}
  case 'dellist':S.lists=S.lists.filter(function(x){return x.id!==DL.id});ui.cat='pend';DL=null;save();closeSheet();render();break;
  case 'mpick':{
   var s=STEPS[ui.mood.step];
   if(s.multi){var arr=ui.mood.ans[s.k]||(ui.mood.ans[s.k]=[]),q=arr.indexOf(v);if(q>=0)arr.splice(q,1);else arr.push(v);render()}
   else{ui.mood.ans[s.k]=(ui.mood.ans[s.k]===v)?undefined:v;render();if(ui.mood.ans[s.k]){setTimeout(function(){moodNext()},220)}}
   break}
  case 'mnext':case 'mskip':if(a==='mskip')delete ui.mood.ans[STEPS[ui.mood.step].k];moodNext();break;
  case 'mback':ui.mood.step=Math.max(0,ui.mood.step-1);render();break;
  case 'mreset':ui.mood={step:0,ans:{},done:false};render();window.scrollTo(0,0);break;
  case 'settings':openSettings();break;
  case 'savesettings':S.name=document.getElementById('s-name').value.trim();S.goal=parseInt(document.getElementById('s-goal').value)||0;save();closeSheet();render();toast('Guardado');break;
  case 'samples':samples();break;
  case 'copyexp':{var txt=JSON.stringify(S);try{navigator.clipboard.writeText(txt).then(function(){toast('Respaldo copiado')}).catch(function(){showExp(txt)})}catch(er){showExp(txt)}break}
  case 'showimp':document.getElementById('imp').innerHTML='<label>Pega aquí tu respaldo</label><textarea id="i-text"></textarea><div class="btns"><button class="btn" data-act="doimp">Importar</button></div>';break;
  case 'doimp':try{var r=JSON.parse(document.getElementById('i-text').value);if(!r||!Array.isArray(r.books))throw 0;S=Object.assign({},DEF,r);save();closeSheet();render();toast('Importado')}catch(er){toast('Ese respaldo no es válido')}break;
 }
});
function showExp(txt){var e=document.getElementById('imp');if(e)e.innerHTML='<label>Copia este texto</label><textarea readonly id="x-text">'+esc(txt)+'</textarea>'}
function moodNext(){
 if(ui.mood.step>=STEPS.length-1){ui.mood.done=true}else ui.mood.step++;
 render();window.scrollTo(0,0);
}
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeSheet()});

render();
initRemote();
try{if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0)navigator.serviceWorker.register('sw.js')}catch(e){}
})();
</script>
</body>
</html>
